# ============================================================
# Docker Compose (Nginx + certbot HTTPS 版)
# ============================================================
# 首次启动（获取证书）:
#   1. 改下面两处 your-domain.com
#   2. 先注释掉 nginx 的 443 和 certbot 的 command
#   3. docker compose -f docker-compose.nginx-https.yml up -d
#   4. docker exec certbot certbot --nginx -d your-domain.com
#   5. 取消第 2 步的注释，重新启动
# ============================================================
version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fullstack-backend
    restart: always
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: fullstack-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-docker-https.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  certbot_data:
  certbot_certs:
