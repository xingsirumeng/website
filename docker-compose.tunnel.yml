# ============================================================
# Docker Compose + Cloudflare Tunnel
# 启动: docker compose -f docker-compose.tunnel.yml up -d
# ============================================================
# 前置工作（仅需一次）:
#   1. brew/apt install cloudflared
#   2. cloudflared tunnel login                   # 绑定账号
#   3. cloudflared tunnel create fullstack-app     # 创建隧道（得到 ID）
#   4. 把生成的 .json 文件放到当前目录，改下面映射路径
# ============================================================
version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  # ---- Cloudflare Tunnel ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run fullstack-app
    volumes:
      - ./deploy/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/root/.cloudflared:ro   # 隧道凭据目录
    depends_on:
      - frontend
      - backend
