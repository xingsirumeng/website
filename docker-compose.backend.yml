# ============================================================
# 仅后端 + Caddy HTTPS（配合 GitHub Pages 前端使用）
# 启动: docker compose -f docker-compose.backend.yml up -d --build
# Caddy 自动申请 Let's Encrypt 证书，后端通过 HTTPS 访问
# ============================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # 必须用绝对路径（4 个斜杠），才能落到下面挂载的 volume 上。
      # 用相对路径 sqlite:///./app.db 会写进容器可写层，容器一重建文章全丢。
      - DATABASE_URL=sqlite:////app/data/app.db
      # 历史图片目录：图片现在存在数据库里，这个目录只在启动时被扫一遍，
      # 用来把早期存成文件的老图导进库。导入确认无误后，这行和下面的挂载都能删。
      - IMAGES_DIR=/app/images
      # 仅用于容器日志的时间戳。文章日期由后端代码按东八区计算（见 app/models.py），
      # 不依赖这个变量，因为 slim 镜像不保证装了 tzdata
      - TZ=Asia/Shanghai
    # backend/.env 被 .dockerignore 排除（不进镜像），密钥在这里注入
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
      # 历史图片目录：只读挂载，仅用于启动时把老图片导入数据库。
      # 图片已经改存数据库（backend_data 卷里的 app.db），这里只读就够。
      # 导入确认无误后可以删掉这一行和 image/ 目录。
      - ./image:/app/images:ro

  caddy:
    image: caddy:alpine
    container_name: backend-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.backend:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  caddy_data:
  backend_data:
