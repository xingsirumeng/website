# .github/workflows/deploy.yml

# 给这个工作流起个名字
name: Deploy frontend folder to GitHub Pages

# 定义在什么情况下触发此工作流
on:
  # 当代码被推送到 main 分支时触发
  push:
    branches: ["main"]
  # 允许你从 GitHub 的 Actions 标签页手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许它向仓库写入内容（用于部署）
permissions:
  contents: write
  pages: write
  id-token: write

# 定义一个任务
jobs:
  # 任务 ID，可以自定义
  deploy:
    # 指定任务运行的环境
    runs-on: ubuntu-latest
    # 这个任务的执行步骤
    steps:
      # 步骤1：检出你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 步骤3：构建前端
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 步骤4：部署到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 部署构建产物，不是源码
          publish_dir: ./frontend/dist