# .github/workflows/deploy.yml

# 给这个工作流起个名字
name: Deploy frontend folder to GitHub Pages

# 定义在什么情况下触发此工作流
on:
  # 当代码被推送到 main 分支时触发
  push:
    branches: ["main"]
  # 允许你从 GitHub 的 Actions 标签页手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许它向仓库写入内容（用于部署）
permissions:
  contents: write
  pages: write
  id-token: write

# 定义一个任务
jobs:
  # 任务 ID，可以自定义
  deploy:
    # 指定任务运行的环境
    runs-on: ubuntu-latest
    # 这个任务的执行步骤
    steps:
      # 步骤1：检出你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：部署到 gh-pages 分支
      - name: Deploy to GitHub Pages
        # 使用第三方大神写好的 Action
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 使用 GitHub 自动生成的 Token 进行身份验证
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 指定要部署的文件夹，这里就是你的 frontend 文件夹
          publish_dir: ./frontend
          # 指定部署到哪个分支，默认就是 gh-pages
          # publish_branch: gh-pages  # 这一行可以省略