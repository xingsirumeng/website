# ============================================================
# Nginx 配置 — 服务器直接部署（非 Docker）
# 放到: /etc/nginx/sites-available/fullstack-app
# ============================================================
# 部署步骤:
#   1. sudo cp deploy/fullstack-app.nginx.conf /etc/nginx/sites-available/fullstack-app
#   2. sudo ln -s /etc/nginx/sites-available/fullstack-app /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
# ============================================================
server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名或 IP

    # 前端静态文件路径
    root /var/www/fullstack-app/frontend;
    index index.html;

    # ---- 前端 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- API 转发到 Python 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---- 基础安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
