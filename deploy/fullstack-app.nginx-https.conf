# ============================================================
# Nginx 配置 — HTTPS + HTTP 自动跳转
# 放到: /etc/nginx/sites-available/fullstack-app
# ============================================================
# 使用步骤:
#   1. 把 your-domain.com 改成你的域名
#   2. sudo cp deploy/fullstack-app.nginx-https.conf \
#           /etc/nginx/sites-available/fullstack-app
#   3. sudo ln -s /etc/nginx/sites-available/fullstack-app \
#               /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d your-domain.com
#   6. certbot 会自动修改此文件，插入 SSL 配置
# ============================================================

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    server_name your-domain.com;   # ← 改这里

    # certbot 需要访问这个路径验证域名
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求全部跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主配置 ----
server {
    listen 443 ssl http2;
    server_name your-domain.com;   # ← 改这里

    # SSL 证书 — certbot 会自动填充这里
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # 前端静态文件
    root /var/www/fullstack-app/frontend;
    index index.html;

    # ---- 前端 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- API 转发 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---- 安全头 ----
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
